<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<title>IT Кам'янець | Розробка та Освіта</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const storedMode = localStorage.getItem('app-mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<meta
			name="description"
			content="IT Кам'янець — ваш надійний партнер у сфері цифрових технологій. Розробка сайтів, навчання студентів та IT-спільнота Кам'янця-Подільського."
		/>
		<meta
			name="keywords"
			content="IT Kamianets, розробка сайтів, навчання, програмування, Кам'янець-Подільський, веб-дизайн, стажування"
		/>
		<meta name="author" content="IT Kamianets Team" />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://itkamianets.com/" />
		<meta property="og:title" content="IT Кам'янець | Цифрові рішення та Освіта" />
		<meta
			property="og:description"
			content="Ласкаво просимо до IT Кам'янець — вашого надійного партнера у сфері цифрових технологій."
		/>
		<meta property="og:image" content="https://itkamianets.com/logo.png" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="IT Кам'янець" />
		<meta
			name="twitter:description"
			content="Інновації, розробка та навчання у Кам'янці-Подільському."
		/>
		<meta name="twitter:image" content="https://itkamianets.com/logo.png" />

		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
	</head>
	<body class="antialiased bg-gray-50 text-slate-900 dark:bg-slate-950 dark:text-white">
		<app-root></app-root>
	</body>
</html>
