<section class="profile-page">
	<div class="profile-card">
		<p class="profile-card__eyebrow">User</p>
		<h1 class="profile-card__title">{{ displayName() }}</h1>
		<dl class="profile-card__meta">
			<div>
				<dt>Email</dt>
				<dd>{{ user().email || 'Not provided' }}</dd>
			</div>
			<div>
				<dt>Phone</dt>
				<dd>{{ user().phone || 'Not provided' }}</dd>
			</div>
			<div>
				<dt>Roles</dt>
				<dd>{{ user().roles.length ? user().roles.join(', ') : 'No roles' }}</dd>
			</div>
		</dl>

		<div class="profile-card__actions">
			<a routerLink="/" class="profile-card__link">Home</a>
			<a routerLink="/manage/events" class="profile-card__link">Events Management</a>
			<button type="button" class="profile-card__button" (click)="userService.logout()">
				Log out
			</button>
		</div>
	</div>
</section>
