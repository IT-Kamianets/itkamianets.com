<section class="articles-page">
    <h1 class="articles-header">Стрічка новин</h1>

    <form class="articles-form" (ngSubmit)="handleSave()">
        <input 
            type="text" 
            name="title" 
            class="articles-form__input" 
            placeholder="Заголовок новини" 
            [ngModel]="formTitle()"
            (ngModelChange)="formTitle.set($event)"
            required
        />
        
        <textarea 
            name="content" 
            class="articles-form__textarea" 
            placeholder="Текст новини..." 
            rows="4" 
            [ngModel]="formContent()"
            (ngModelChange)="formContent.set($event)"
            required>
        </textarea>
        
        <button type="submit" class="articles-form__button">
            {{ editingId() ? 'Зберегти зміни' : 'Додати новину' }}
        </button>
    </form>

    <div class="articles-grid">
        @for (item of newsList(); track item.id) {
            <div class="articles-card">
                <h3 class="articles-card__title">{{ item.title }}</h3>
                <p class="articles-card__content">{{ item.content }}</p>
                
                <div class="articles-card__actions">
                    <button type="button" class="articles-card__btn-edit" (click)="handleEdit(item)">
                        Редагувати
                    </button>
                    <button type="button" class="articles-card__btn-delete" (click)="handleDelete(item.id)">
                        Видалити
                    </button>
                </div>
            </div>
        } @empty {
            <p class="articles-empty">Новин поки немає. Додайте першу!</p>
        }
    </div>
</section>
