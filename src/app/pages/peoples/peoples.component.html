<div class="py-12 px-4 max-w-7xl mx-auto">
	<div class="mb-10 text-center">
		<h1 class="text-4xl font-bold mb-4" style="color: var(--c-text-secondary)">
			Учасники спільноти
		</h1>
		<p class="text-lg" style="color: var(--c-text-primary)">
			Знайомтеся з людьми, які творять IT екосистему Кам'янця-Подільського.
		</p>
	</div>

	<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
		@for (person of peoples(); track person.id) {
			<a
				[routerLink]="['/people', person.id]"
				class="person-card group flex flex-col items-center p-6 rounded-2xl transition-all duration-300 hover:-translate-y-1 text-center cursor-pointer"
				style="background-color: var(--c-bg-secondary)"
			>
				<img
					[src]="'developer/' + person.avatar + '.png'"
					[alt]="person.name"
					class="w-32 h-32 rounded-full object-cover mb-4 transition-all"
				/>
				<h3 class="text-xl font-bold mb-1" style="color: var(--c-text-secondary)">
					{{ person.name }}
				</h3>
				<span
					class="text-sm px-3 py-1 rounded-full font-medium mb-3"
					style="background-color: var(--c-bg-primary); color: var(--c-text-primary)"
				>
					{{ person.role }}
				</span>
				<p class="text-sm opacity-70 line-clamp-2" style="color: var(--c-text-primary)">
					{{ person.university }}
				</p>
				
				<div class="mt-5 flex items-center justify-center gap-1 text-sm font-semibold transition-all duration-300 opacity-60 group-hover:opacity-100" style="color: var(--c-primary)">
					<span>Переглянути профіль</span>
					<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1" aria-hidden="true">arrow_forward</span>
				</div>
			</a>
		}
	</div>
</div>
