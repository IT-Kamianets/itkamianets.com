<header class="mb-12">
	<h1 class="text-4xl font-bold text-[var(--c-text-primary)] mb-2">Досягнення</h1>
	<p class="text-lg text-[var(--c-text-secondary)]">Дізнайтеся про досягнення нашої команди</p>
</header>

@if (achievements().length > 0) {
	<div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
		@for (achievement of achievements(); track achievement._id) {
			<article
				class="cursor-pointer border border-[var(--c-border)] rounded-lg p-6 hover:shadow-lg hover:border-[var(--c-primary)] transition-all duration-200 bg-[var(--c-bg-secondary)]"
				(click)="goToDetail(achievement)"
			>
				<h2 class="text-xl font-semibold text-[var(--c-text-primary)] mb-2">
					{{ achievement.name }}
				</h2>
				<p class="text-[var(--c-text-secondary)] line-clamp-3">
					{{ achievement.description || 'Немає опису' }}
				</p>
				<div class="mt-4 flex justify-end">
					<span class="text-[var(--c-primary)] font-medium hover:underline">
						Детальніше →
					</span>
				</div>
			</article>
		}
	</div>
} @else {
	<div class="text-center py-12">
		<p class="text-[var(--c-text-secondary)] text-lg">Досягнень ще не додано</p>
	</div>
}
