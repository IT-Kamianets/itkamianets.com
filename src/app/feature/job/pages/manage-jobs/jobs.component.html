<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="sm:flex sm:items-center mb-10">
        <div class="sm:flex-auto">
            <div class="flex items-center gap-3">
                <a routerLink="/manage" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-[var(--c-border)] bg-[var(--c-bg-secondary)] text-[var(--c-text-secondary)] hover:border-[var(--c-primary)] hover:text-[var(--c-primary)] transition-all">
                    <span class="material-symbols-outlined text-xl">arrow_back</span>
                </a>
                <h1 class="text-2xl font-black leading-tight text-[var(--c-text-secondary)] sm:text-4xl">Керування вакансіями</h1>
            </div>
            <p class="mt-2 text-sm text-[var(--c-text-muted)] max-w-2xl">
                Створюйте та редагуйте вакансії для IT-спільноти Кам'янця-Подільського.
            </p>
        </div>
        <div class="mt-6 sm:ml-16 sm:mt-0 sm:flex-none">
            <p-button label="Створити вакансію" icon="pi pi-plus" (onClick)="create()" severity="primary" [rounded]="true"></p-button>
        </div>
    </div>

    <!-- PrimeNG Table -->
    <div class="bg-[var(--c-bg-secondary)] rounded-[2.5rem] border border-[var(--c-border)] shadow-sm overflow-hidden">
        <p-table [value]="jobs()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="data.title" class="!bg-[var(--c-bg-tertiary)] !py-5 !pl-8 text-left text-xs font-black uppercase tracking-widest text-[var(--c-text-muted)]">Назва <p-sortIcon field="data.title"></p-sortIcon></th>
                    <th pSortableColumn="data.company" class="!bg-[var(--c-bg-tertiary)] !py-5 text-left text-xs font-black uppercase tracking-widest text-[var(--c-text-muted)]">Компанія <p-sortIcon field="data.company"></p-sortIcon></th>
                    <th class="!bg-[var(--c-bg-tertiary)] !py-5 text-left text-xs font-black uppercase tracking-widest text-[var(--c-text-muted)]">Статус</th>
                    <th style="width: 150px" class="!bg-[var(--c-bg-tertiary)] !py-5 text-center text-xs font-black uppercase tracking-widest text-[var(--c-text-muted)]">Дії</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-job>
                <tr class="hover:bg-[var(--c-bg-primary)]/30 transition-colors">
                    <td class="!py-6 !pl-8 font-bold text-[var(--c-text-secondary)]">{{job.data.title}}</td>
                    <td class="font-bold text-[var(--c-text-muted)]">{{job.data.company}}</td>
                    <td>
                        <p-tag [severity]="job.data.status === 'active' ? 'success' : 'danger'" [value]="job.data.status === 'active' ? 'Активна' : 'Закрита'"></p-tag>
                    </td>
                    <td>
                        <div class="flex gap-2 justify-center">
                            <p-button icon="pi pi-pencil" (onClick)="edit(job)" [rounded]="true" [outlined]="true" severity="secondary"></p-button>
                            <p-button icon="pi pi-trash" (onClick)="delete(job)" [rounded]="true" [outlined]="true" severity="danger"></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="py-24 text-center">
                        <p class="text-lg font-black text-[var(--c-text-secondary)]">Вакансій не знайдено</p>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- Edit/Create Dialog -->
    <p-dialog [(visible)]="displayDialog" [header]="selectedJob()?._id ? 'Редагувати вакансію' : 'Створити вакансію'" [modal]="true" [style]="{width: '100%', maxWidth: '600px'}" [draggable]="false" [resizable]="false">
        @if (selectedJob(); as current) {
            <div class="flex flex-col gap-5 py-4">
                <div class="flex flex-col gap-2">
                    <label for="title" class="font-bold text-[var(--c-text-secondary)]">Назва вакансії</label>
                    <input pInputText id="title" [(ngModel)]="current.data.title" placeholder="Наприклад: Senior Angular Developer" class="w-full" />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="company" class="font-bold text-[var(--c-text-secondary)]">Компанія</label>
                    <input pInputText id="company" [(ngModel)]="current.data.company" placeholder="Назва компанії" class="w-full" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-bold text-[var(--c-text-secondary)]">Зображення</label>
                    <div class="group relative flex aspect-video w-full flex-col items-center justify-center overflow-hidden rounded-2xl border-2 border-dashed border-[var(--c-border)] bg-[var(--c-bg-primary)] transition-all hover:border-[var(--c-primary)]">
                        @if (current.data.preview) {
                            <img [src]="current.data.preview" class="h-full w-full object-cover" />
                            <div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 transition-opacity group-hover:opacity-100">
                                <p-button icon="pi pi-trash" (onClick)="current.data.preview = ''" severity="danger" [rounded]="true"></p-button>
                            </div>
                        } @else {
                            <label class="flex h-full w-full cursor-pointer flex-col items-center justify-center gap-2">
                                <span class="pi pi-cloud-upload text-4xl text-[var(--c-text-muted)]"></span>
                                <span class="text-sm font-black text-[var(--c-text-muted)] uppercase tracking-wider">Натисніть для завантаження</span>
                                <input type="file" (change)="onImageUpload($event)" accept="image/*" class="hidden" />
                            </label>
                        }
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-bold text-[var(--c-text-secondary)]">Статус вакансії</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" id="active" name="status" value="active" [(ngModel)]="current.data.status" class="w-5 h-5 cursor-pointer accent-[var(--c-primary)]">
                            <span class="text-sm font-bold text-[var(--c-text-secondary)] group-hover:text-[var(--c-primary)]">АКТИВНА</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" id="closed" name="status" value="closed" [(ngModel)]="current.data.status" class="w-5 h-5 cursor-pointer accent-rose-500">
                            <span class="text-sm font-bold text-[var(--c-text-secondary)] group-hover:text-rose-500">ЗАКРИТА</span>
                        </label>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="requirements" class="font-bold text-[var(--c-text-secondary)]">Вимоги (через кому)</label>
                    <input pInputText id="requirements" [ngModel]="getRequirementString(current)" (ngModelChange)="setRequirements($event)" placeholder="Angular, TypeScript, Tailwind" class="w-full" />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="description" class="font-bold text-[var(--c-text-secondary)]">Опис вакансії</label>
                    <textarea pTextarea id="description" [(ngModel)]="current.data.description" rows="5" placeholder="Опишіть роль та умови..." class="w-full"></textarea>
                </div>
            </div>
        }
        <ng-template pTemplate="footer">
            <p-button label="Скасувати" (onClick)="displayDialog.set(false)" [text]="true" severity="secondary"></p-button>
            <p-button label="Зберегти" (onClick)="save()" [loading]="isSaving()" severity="primary"></p-button>
        </ng-template>
    </p-dialog>

    <p-confirmDialog></p-confirmDialog>
</div>
