<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
	<!-- Header -->
	<div class="sm:flex sm:items-center mb-10">
		<div class="sm:flex-auto">
			<div class="flex items-center gap-3">
				<a routerLink="/manage" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border-2 border-slate-200 bg-white text-slate-600 hover:border-[#256eff] hover:text-[#256eff] transition-all shadow-sm">
					<span class="pi pi-arrow-left font-bold"></span>
				</a>
				<h1 class="text-3xl font-black text-slate-800">Заявки</h1>
			</div>
		</div>
	</div>

	<!-- Data Table -->
	<div class="bg-white rounded-[2rem] border-2 border-slate-100 shadow-xl overflow-hidden">
		<p-table [value]="proposals()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
			<ng-template pTemplate="header">
				<tr class="bg-slate-50">
					<th class="py-5 pl-8 text-left text-xs font-black uppercase text-slate-400 tracking-widest">Кандидат</th>
					<th class="py-5 text-left text-xs font-black uppercase text-slate-400 tracking-widest">Вакансія</th>
					<th class="py-5 text-left text-xs font-black uppercase text-slate-400 tracking-widest">Контакти</th>
					<th class="py-5 text-center text-xs font-black uppercase text-slate-400 tracking-widest">Дії</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-proposal>
				<tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
					<td class="py-6 pl-8">
						<div class="text-sm font-black text-slate-700">{{ proposal.candidateName }}</div>
					</td>
					<td class="py-6">
						<span class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-black uppercase">
							{{ getJobTitle(proposal.jobId) }}
						</span>
					</td>
					<td class="py-6">
						<div class="text-xs font-bold text-slate-500 flex flex-col gap-1">
							<span class="flex items-center gap-1.5"><i class="pi pi-envelope text-[10px]"></i> {{ proposal.email }}</span>
							<span class="flex items-center gap-1.5"><i class="pi pi-phone text-[10px]"></i> {{ proposal.phone }}</span>
						</div>
					</td>
					<td class="py-6 text-center">
                        <button
                            (click)="deleteProposal(proposal)"
                            class="h-9 w-9 inline-flex items-center justify-center rounded-xl bg-[#f43f5e] text-white shadow-md hover:scale-105 active:scale-95 transition-all">
                            <span class="pi pi-trash text-sm"></span>
                        </button>
					</td>
				</tr>
			</ng-template>
			<ng-template pTemplate="emptymessage">
				<tr>
					<td colspan="4" class="py-24 text-center">
						<p class="text-lg font-black text-slate-300 uppercase tracking-widest">Заявок поки немає</p>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</div>
</div>
