<app-manage-header></app-manage-header>
<main class="manage-layout">
	<aside class="manage-sidebar">
		<p class="manage-sidebar__eyebrow">Control panel</p>
		<nav class="manage-sidebar__nav" aria-label="Manage navigation">
			@for (item of navItems; track item.path) {
				<a
					[routerLink]="item.path"
					routerLinkActive="manage-sidebar__link--active"
					class="manage-sidebar__link"
				>
					<span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
					<span>{{ item.label }}</span>
				</a>
			}
		</nav>
	</aside>

	<section class="manage-content">
		<router-outlet></router-outlet>
	</section>
</main>
<app-scroll-to-top></app-scroll-to-top>
