<header class="header">
	<nav class="header__inner">

		<!-- ============================================ -->
		<!-- DESKTOP LAYOUT (>= 640px) -->
		<!-- ============================================ -->
		<div class="header__desktop">
			<!-- Left: Logo + Brand -->
			<div class="header__brand">
				<div class="header__logo-wrap">
					<img src="logo.png" alt="Logo" class="header__logo"/>
				</div>
				<span class="header__brand-name">IT-KAMIANETS</span>
			</div>

			<!-- Center: Navigation Links -->
			<div class="header__nav-pill">
				<a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="header__link--active" class="header__link">Головна</a>
				<a routerLink="/proposals" routerLinkActive="header__link--active" class="header__link">Пропозиції</a>
				<a routerLink="/our-team" routerLinkActive="header__link--active" class="header__link">Наша команда</a>
				<a routerLink="/our-projects" routerLinkActive="header__link--active" class="header__link">Наші проєкти</a>
				<a routerLink="/order" routerLinkActive="header__link--active" class="header__link">Замовити</a>
			</div>

			<!-- Right: Theme Toggle -->
			<div class="header__actions">
				<button type="button" class="theme-toggle" [class.theme-toggle--dark]="isDark" (click)="toggleTheme()" aria-label="Toggle theme">
					<svg class="theme-toggle__icon theme-toggle__sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="5"/>
						<line x1="12" y1="1" x2="12" y2="3"/>
						<line x1="12" y1="21" x2="12" y2="23"/>
						<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
						<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
						<line x1="1" y1="12" x2="3" y2="12"/>
						<line x1="21" y1="12" x2="23" y2="12"/>
						<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
						<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
					</svg>
					<svg class="theme-toggle__icon theme-toggle__moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
					</svg>
				</button>
			</div>
		</div>

		<!-- ============================================ -->
		<!-- MOBILE LAYOUT (< 640px) -->
		<!-- ============================================ -->
		<div class="header__mobile">
			<!-- Row 1: Logo + Brand + Theme Toggle -->
			<div class="header__mobile-top">
				<div class="header__brand header__brand--sm">
					<div class="header__logo-wrap header__logo-wrap--sm">
						<img src="logo.png" alt="Logo" class="header__logo"/>
					</div>
					<span class="header__brand-name">IT-KAMIANETS</span>
				</div>
				<button type="button" class="theme-toggle theme-toggle--sm" [class.theme-toggle--dark]="isDark" (click)="toggleTheme()" aria-label="Toggle theme">
					<svg class="theme-toggle__icon theme-toggle__sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="5"/>
						<line x1="12" y1="1" x2="12" y2="3"/>
						<line x1="12" y1="21" x2="12" y2="23"/>
						<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
						<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
						<line x1="1" y1="12" x2="3" y2="12"/>
						<line x1="21" y1="12" x2="23" y2="12"/>
						<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
						<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
					</svg>
					<svg class="theme-toggle__icon theme-toggle__moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
					</svg>
				</button>
			</div>

			<!-- Row 2: Navigation Links -->
			<div class="header__nav-pill header__nav-pill--mobile">
				<a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="header__link--active" class="header__link">Головна</a>
				<a routerLink="/proposals" routerLinkActive="header__link--active" class="header__link">Пропозиції</a>
				<a routerLink="/our-team" routerLinkActive="header__link--active" class="header__link">Наша команда</a>
				<a routerLink="/our-projects" routerLinkActive="header__link--active" class="header__link">Наші проєкти</a>
				<a routerLink="/order" routerLinkActive="header__link--active" class="header__link">Замовити</a>
			</div>
		</div>
	</nav>
</header>
